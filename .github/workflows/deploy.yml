name: Build and Deploy

on:
  push:
    branches: [ "main" ]
  # allows manual trigger
  workflow_dispatch:

env:
  IMAGE_NAME: recruit-bot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
  
    steps:
      - name: Deploy via SSH
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          ENV_PATH: ${{ secrets.ENV_PATH }}
        run: |
          ssh app-recrawler "bash -se" <<EOF
          set -euo pipefail

          IMAGE_ID="${DOCKER_USERNAME}/${IMAGE_NAME}"
  
          echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin
  
          docker pull "\${IMAGE_ID}:latest"
  
          docker stop recruit-bot || true
          docker rm recruit-bot || true
  
          mkdir -p ./data
  
          docker run -d --name recruit-bot --restart unless-stopped \
            -v "\$(pwd)/data:/data" \
            --env-file "\${ENV_PATH}" \
            -e SEEN_DB_PATH=/data/seen.db \
            -e TZ=Asia/Seoul \
            "\${IMAGE_ID}:latest"
  
          docker image prune -f
          EOF

